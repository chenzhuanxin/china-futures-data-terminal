<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国内期货全量数据终端</title>
<style>
:root{
  --bg:#eef2f7; --panel:#fff; --panel2:#f7f9fc; --line:#dfe6ef; --line2:#eaeff5;
  --txt:#1b2432; --txt2:#5b6b80; --txt3:#8b9aad;
  --accent:#2563eb; --accent2:#1d4ed8; --accent-soft:#eaf1ff;
  --up:#d8342b; --down:#0a9d5c; --flat:#6b7a8d;
  --warn:#b06a05; --warnbg:#fdf5e6;
  --radius:10px; --shadow:0 1px 2px rgba(16,32,64,.05),0 6px 20px rgba(16,32,64,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:13px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1600px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(180deg,#fff,#fbfcfe);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:60;box-shadow:0 1px 0 rgba(16,32,64,.03)}
.hd{display:flex;align-items:center;gap:16px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo .mark{width:28px;height:28px;border-radius:8px;flex:none;background:linear-gradient(135deg,#2563eb,#0ea5e9);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800}
.hd .sub{color:var(--txt3);font-size:12px;border-left:1px solid var(--line);padding-left:14px}
.hd .spacer{flex:1}
.hd .rbtns{display:flex;align-items:center;gap:10px;flex:none}
.hd .rbtns .lstat{font-size:11.5px;color:var(--txt3);white-space:nowrap}
.hd .rbtns .lstat.err{color:#c0392b}
.hd .meta{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt2);white-space:nowrap}
.pill b{color:var(--txt);font-weight:600}
.pill.live{background:#e9f7f0;border-color:#c6ebd8;color:#0a7a48}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{appearance:none;border:0;background:transparent;font:inherit;font-size:13px;color:var(--txt2);
  padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--txt);background:var(--panel2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:18px 0 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>.hd2{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card>.hd2 h3{margin:0;font-size:14px;font-weight:650}
.card>.hd2 .desc{color:var(--txt3);font-size:12px;flex:1;min-width:180px}
.card>.bd{padding:14px 16px}
.card>.bd.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--txt);outline:none;min-width:0}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search],input[type=text]{min-width:190px}
button.btn,.btn{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--txt);cursor:pointer;white-space:nowrap;display:inline-block}
button.btn:hover,.btn:hover{border-color:#c3cfe0;background:var(--panel2);text-decoration:none}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{background:var(--accent2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;
  color:var(--txt2);cursor:pointer;user-select:none}
.chip:hover{border-color:#c3cfe0}
.chip.on{background:var(--accent-soft);border-color:#bed3ff;color:var(--accent2);font-weight:600}
.chip b{opacity:.6;font-weight:500}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.tw{overflow:auto;max-height:660px;border-top:1px solid var(--line2)}
.tw.short{max-height:420px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:right;font-weight:600;
  color:var(--txt2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:first-child,thead th.l{text-align:left}
thead th:hover{color:var(--accent)}
thead th .ar{opacity:.3;font-size:10px;margin-left:3px}
thead th.sorted{color:var(--accent)}
thead th.sorted .ar{opacity:1}
tbody td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
tbody td:first-child,tbody td.l{text-align:left}
tbody tr:hover{background:#f6f9ff}
td.name{font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt2);margin-left:6px;vertical-align:1px}
.tag.k-real{background:#eef6ff;border-color:#cfe2ff;color:#1f5fbf}
.tag.k-main_link{background:#fdeceb;border-color:#f8d4d1;color:#b32b23}
.tag.k-sub_main_link{background:#f6f0ff;border-color:#e0d3fa;color:#6b3fc4}
.tag.k-month_link,.tag.k-continuous,.tag.k-index{background:#eef7f1;border-color:#cdeada;color:#0a7a48}
.empty{padding:40px 16px;text-align:center;color:var(--txt3)}
.mini{font-size:11.5px;color:var(--txt3)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 16px;
  border-top:1px solid var(--line2);font-size:12.5px;color:var(--txt2);flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{color:var(--txt3);font-size:11.5px;margin-bottom:4px}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .x{font-size:11.5px;color:var(--txt3);margin-top:3px}
.notice{padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:12px;border:1px solid;
  line-height:1.7}
.notice .spin{margin-right:7px}
.notice.info{background:#eff6ff;border-color:#cfe2ff;color:#1e4f9c}
.notice.warn{background:var(--warnbg);border-color:#f0dcb4;color:var(--warn)}
.notice.err{background:#fdf0ef;border-color:#f7d3d0;color:#b32b23}
.notice.ok{background:#eefaf3;border-color:#c8ebd9;color:#0a7a48}
.notice code{background:rgba(0,0,0,.05);padding:1px 4px;border-radius:3px;font-size:11.5px}
.chartbox{border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.chart{width:100%;height:580px}
/* K线页「当前行情」面板 */
.qwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 16px;margin-bottom:16px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.qhead h3{margin:0;font-size:14px;font-weight:650;white-space:nowrap}
.qhead .qname{font-size:12.5px;color:var(--txt2)}
.qhead .sp{flex:1;min-width:0}
.qgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.qcell{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:0}
.qcell .qk{display:block;color:var(--txt3);font-size:11px;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcell .qv{display:block;font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcell .qx{display:block;font-size:11px;color:var(--txt3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcell.pri{background:linear-gradient(135deg,#f6f9ff,#eaf2ff);border-color:#d5e2fb}
.qcell.pri .qv{font-size:22px}
.newscard{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:#fff;box-shadow:var(--shadow)}
.newscard h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.newscard .links{display:flex;flex-direction:column;gap:6px}
.newscard .links a{font-size:12.5px;display:flex;align-items:center;gap:6px}
.newscard .links .none{color:var(--txt3);font-size:11.5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.dot.em{background:#e2683a}.dot.sina{background:#c0392b}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;flex:none;margin-top:2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------------- 数据源说明（页脚卡片，位于免责声明上方） ---------------- */
.srcbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin:14px 0 16px;overflow:hidden}
footer .srcbox{margin:16px 0 0;box-shadow:none;background:#fbfdff}
.srcbox .shd{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;
  user-select:none;flex-wrap:wrap}
.srcbox .shd b{font-size:13px;flex:none}
.srcbox .shd .sum{color:var(--txt3);font-size:12px;flex:1;min-width:220px}
.srcbox .shd .tog{font-size:11.5px;color:var(--accent);white-space:nowrap;flex:none}
.srcbox .sbd{padding:0 16px 6px;border-top:1px dashed var(--line)}
.srcbox .li{display:flex;gap:8px;align-items:flex-start;line-height:1.7;padding:7px 0}
.srcbox .li + .li{border-top:1px dashed var(--line2)}
.srcbox .li .n{flex:none;width:16px;height:16px;border-radius:50%;background:var(--accent-soft);
  color:var(--accent);font-size:10.5px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:3px}
.srcbox .li .u{color:var(--txt3);font-size:11.5px}
footer{padding:0 0 40px;color:var(--txt3);font-size:12px;line-height:1.8}
footer .fbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 18px}
footer .fgrid{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
footer .fcol{flex:1;min-width:260px}
footer .fcol h5{margin:0 0 9px;font-size:12.5px;color:var(--txt);font-weight:700;letter-spacing:.2px}
footer .fsrc .use{color:var(--txt3);font-size:11.5px}
footer .authorbox{flex:none;min-width:250px;background:linear-gradient(135deg,#f7faff,#eef4ff);
  border:1px solid #d8e6ff;border-radius:10px;padding:14px 18px}
footer .authorbox .lbl{font-size:11.5px;color:var(--txt3);letter-spacing:.6px}
footer .authorbox .nm{font-size:16px;font-weight:800;color:var(--txt);margin-top:3px;letter-spacing:.5px}
footer .authorbox .wx{font-size:13px;color:var(--txt2);margin-top:6px}
footer .authorbox .wx b{color:#0a7a48;font-family:ui-monospace,Consolas,Menlo,monospace;letter-spacing:.6px}
footer .fnote{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--txt3);line-height:1.78}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo"><span class="mark">期</span><span>国内期货全量数据终端</span></div>
      <div class="spacer"></div>
      <div class="rbtns" id="rbtns"></div>
      <div class="meta" id="hmeta"></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>
<main>
  <div class="wrap" id="view"></div>
</main>
<footer id="foot"></footer>

<script>/*__ECHARTS__*/</script>
<script>/*__XLSX__*/</script>
<script>window.__DATA__ = /*__DATA__*/{};</script>
<script>
"use strict";
/* =====================================================================
   国内期货全量数据终端
   数据源：东方财富（期货行情 futsseapi / 数据中心龙虎榜 datacenter-web）
           新浪财经（期货 K 线 stock2 JSONP）
   ===================================================================== */
const D = window.__DATA__ || {};
const CONTRACTS = D.contracts || [];
const VARIETIES = D.varieties || [];
const CATS = (D.categories && D.categories.categories) || {};
const STATS = (D.categories && D.categories.stats) || {};
const WEIGHTED = D.weighted || {};
const NEWS = D.newslinks || {};
const META = D.meta || {};
const LHB_INDEX = D.lhbIndex || {};
const KLINE_CORE = D.klineCoreIndex || {};

/* =====================================================================
   应用信息 · 数据源登记 · 作者信息
   （页头数据源条、页脚、各页数据源标注统一引用此处，避免多处不一致）
   ===================================================================== */
const APP = {
  name: "国内期货全量数据终端",
  version: "1.0.0",
  author: "陈专新",
  wechat: "gongqizi0",
  sources: [
    { key:"emq", name:"东方财富 · 期货行情接口", host:"futsseapi.eastmoney.com",
      url:"https://qhweb.eastmoney.com/quote", color:"#e2683a",
      use:"国内全部期货合约的实时行情快照（最新价 / 涨跌 / 成交 / 持仓 / 夜盘 / 交割月等）" },
    { key:"lhb", name:"东方财富 · 数据中心 · 期货龙虎榜", host:"datacenter-web.eastmoney.com",
      url:"https://data.eastmoney.com/futures/dl/data.html", color:"#e2683a",
      use:"会员成交持仓排名 / 持仓结构 / 建仓过程 / 持仓均价 / 盈亏分析" },
    { key:"sina", name:"新浪财经 · 期货 K 线接口", host:"stock2.finance.sina.com.cn",
      url:"https://finance.sina.com.cn/futures/quotes/RB.shtml", color:"#c0392b",
      use:"分时 / 5·15·30·60 分 / 日 / 周 / 月 / 年 K 线全量历史（周月年由日K聚合）" },
    { key:"emnews", name:"东方财富 · 期货品种资讯页", host:"futures.eastmoney.com",
      url:"https://futures.eastmoney.com/a/adp.html", color:"#e2683a",
      use:"各品种资讯页 / 品种评论页链接" },
    { key:"sinanews", name:"新浪财经 · 期货品种资讯页", host:"finance.sina.com.cn/money/future",
      url:"http://finance.sina.com.cn/money/future/CJ/", color:"#c0392b",
      use:"各品种资讯频道 / 品种行情页链接" },
  ],
};
function srcBy(key){ return APP.sources.find(s => s.key === key) || {}; }
/* 页脚「数据源说明」卡片（位于免责声明上方，点击标题可展开 / 收起，状态本地记忆） */
const SRC_SUMMARY = "东方财富 · 期货行情 / 龙虎榜 / 品种资讯　│　新浪财经 · 期货 K 线 / 品种资讯"
  + "　—— 全部为公开线上真实数据，点击条目名称可打开数据源官网";
function renderSrcbar(){
  const b = $("#srcbar"); if(!b) return;
  b.innerHTML = "";
  let open = true;
  try{ open = localStorage.getItem("fut_src_open") !== "0"; }catch(e){}
  const body = el("div",{class:"sbd"});
  const tog = el("span",{class:"tog"});
  const paint = () => {
    body.innerHTML = "";
    tog.innerHTML = open ? "收起 ▴" : "展开说明 ▾";
    if(open) APP.sources.forEach((s,i) => body.append(el("div",{class:"li"},
      el("span",{class:"n", html:String(i+1)}),
      el("div",{},
        el("div",{}, el("a",{href:s.url, target:"_blank", html:s.name + "　↗"}),
          el("span",{class:"u", html:"（"+s.host+"）"})),
        el("div",{class:"u", html:"用途："+s.use})))));
  };
  paint();
  b.append(el("div",{class:"shd", onclick:()=>{
      open = !open;
      try{ localStorage.setItem("fut_src_open", open ? "1" : "0"); }catch(e){}
      paint();
    }},
    el("b",{html:"数据源说明"}),
    el("span",{class:"sum", html:SRC_SUMMARY}),
    tog), body);
}
/* 页脚：数据覆盖口径 + 作者信息 + 数据源说明 + 免责说明 */
function renderFooter(){
  const f = $("#foot"); if(!f) return;
  f.innerHTML = "";
  const box = el("div",{class:"fbox"});
  const grid = el("div",{class:"fgrid"});

  const col2 = el("div",{class:"fcol"}, el("h5",{html:"数据覆盖与口径"}));
  col2.append(el("div",{class:"use", style:"font-size:12px;color:var(--txt2);line-height:1.85", html:
    `合约 <b>${num(STATS.total||CONTRACTS.length)}</b> 个（真实合约 <b>${num(STATS.realCount||0)}</b> 个）　`
    + `品种 <b>${VARIETIES.length}</b> 个　加权合约 <b>${META.weightedCount||0}</b> 个　`
    + `龙虎榜快照 <b>${META.lhbCount||0}</b> 个合约<br>`
    + "行情为生成时刻快照；K 线为打开页面时按需联网拉取的全量历史；"
    + "品种加权合约由<b>真实月份合约按持仓量加权自算</b>，不含主连 / 次主连 / 连续 / 加权指数 / 月均等衍生代码。"
    + "所有数值均直接取自上述公开接口，未作任何模拟、插值或补全。"}));

  const author = el("div",{class:"authorbox"},
    el("div",{class:"lbl", html:"设 计 / 制 作"}),
    el("div",{class:"nm", html:APP.author}),
    el("div",{class:"wx", html:"微信：<b>"+APP.wechat+"</b>"}),
    el("div",{class:"use", style:"margin-top:8px;font-size:11.5px;color:var(--txt3)",
      html:APP.name+"　v"+APP.version}));

  grid.append(col2, author);
  box.append(grid);
  box.append(el("div",{class:"srcbox", id:"srcbar"}));      // 数据源说明（免责声明上方）
  box.append(el("div",{class:"fnote", html:
    "免责声明：本页面为数据聚合工具，所有行情、K 线与龙虎榜数据均来源于东方财富、新浪财经的公开接口，"
    + "版权与最终解释权归数据提供方所有。数据仅供学习与研究参考，<b>不构成任何投资建议</b>，据此操作风险自担。"}));
  f.append(box);
  renderSrcbar();
}

/* =====================================================================
   实时更新：「更新数据」按钮 + 每 2 分钟自动刷新
   联网拉取东方财富 6 大市场整市行情列表，就地合并进当前页面数据并重绘
   ===================================================================== */
const LIVE = {timer:null, busy:false, lastAt:null, lastN:0};
const LIVE_MS = 2 * 60 * 1000;                    // 自动刷新间隔：2 分钟
const LIVE_MKTS = ["113","114","115","225","142","220"];
const LIVE_FIELDS = ["p","zde","zdf","o","h","l","zjsj","jjsj","vol","ccl","rz","cje","zf","wp","np"];
let LIVE_IDX = null;
function liveIndex(){
  if(LIVE_IDX) return LIVE_IDX;
  LIVE_IDX = new Map();
  CONTRACTS.forEach(c => LIVE_IDX.set(c.market + "|" + String(c.codeUpper||c.code||"").toUpperCase(), c));
  return LIVE_IDX;
}
function typingInForm(){
  const a = document.activeElement;
  return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
}
function paintLive(err){
  const b = $("#liveBtn"), s = $("#liveStatus"); if(!b) return;
  b.disabled = LIVE.busy;
  b.innerHTML = LIVE.busy ? "更新中…" : "更新数据";
  if(s){
    s.classList.toggle("err", !!err);
    if(LIVE.busy) s.innerHTML = "正在拉取最新行情…";

function toLhbCode(rec){
  const m = /^([A-Za-z]+)(\d+)$/.exec(String(rec.code||""));
  if(!m) return String(rec.code||"").toUpperCase();
  let digits = m[2];
  if(digits.length === 3) digits = "2" + digits;
  const code = m[1] + digits;
  return (rec.exch === "INE" || rec.exch === "GFEX") ? code.toLowerCase() : code.toUpperCase();
}

/* ---------------- 周/月/年 K 由日K全量聚合 ---------------- */
function aggregate(rows, mode){
  if(!rows.length) return [];
  const out = [];
  const keyOf = d => {
    const p = d.split("-").map(Number);
    if(mode === "week"){
      const t = new Date(Date.UTC(p[0], p[1]-1, p[2]));
      const wd = (t.getUTCDay()+6) % 7;
      t.setUTCDate(t.getUTCDate() - wd);
      return t.toISOString().slice(0,10);
    }
    return mode === "month" ? d.slice(0,7) : d.slice(0,4);
  };
  let cur = null;
  rows.forEach(r => {
    const k = keyOf(r.d);
    if(!cur || cur.k !== k){
      cur = {k, d:r.d, o:+r.o, h:+r.h, l:+r.l, c:+r.c, v:+(r.v||0), p:+(r.p||0)};
      out.push(cur);
    } else {
      cur.h = Math.max(cur.h, +r.h); cur.l = Math.min(cur.l, +r.l);
      cur.c = +r.c; cur.v += +(r.v||0); cur.p = +(r.p||0);
    }
  });
  return out;
}

/* ---------------- 通用可排序表格 ---------------- */
function dataTable(opts){
  const st = {sortKey:opts.sortKey||null, sortDir:opts.sortDir||-1, page:1, size:opts.size||0, kw:""};
  let rows = (opts.rows||[]).slice();
  const box = el("div",{class:"card"});
  const hd = el("div",{class:"hd2"}, el("h3",{},opts.title||""));
  if(opts.desc) hd.append(el("div",{class:"desc",html:opts.desc}));
  box.append(hd);
  const ctl = el("div",{class:"bd"});
  const tw = el("div",{class:"tw"+(opts.short?" short":"")});
  const tb = el("table"), thead = el("thead"), tbody = el("tbody");
  const trh = el("tr");
  opts.columns.forEach(c => {
    const th = el("th",{class:c.left?"l":"", title:c.tip||""});
    th.append(document.createTextNode(c.label));
    if(c.sortable !== false){
      th.append(el("span",{class:"ar", html:"↕"}));
      th.onclick = ()=>{ st.sortDir = (st.sortKey === c.key) ? -st.sortDir : -1; st.sortKey = c.key; paint(); };
    }
    th._key = c.key; trh.append(th);
  });
  thead.append(trh); tb.append(thead); tb.append(tbody); tw.append(tb);
  box.append(ctl); box.append(tw);
  const pager = el("div",{class:"pager"}); box.append(pager);
  function filtered(){
    let r = rows;
    if(st.kw){
      if(opts.searchFn) r = r.filter(x => opts.searchFn(x, st.kw));
      else if(opts.searchKeys){
        const k = st.kw.toLowerCase();
        r = r.filter(x => opts.searchKeys.some(s => String(x[s]===undefined?"":x[s]).toLowerCase().includes(k)));
      }
    }
    if(st.sortKey){
      const col = opts.columns.find(c => c.key === st.sortKey);
      r = r.slice().sort((a,b)=>{
        let x = a[st.sortKey], y = b[st.sortKey];
        if(col && col.sortVal){ x = col.sortVal(a); y = col.sortVal(b); }
        const xE = (x===null||x===undefined||x===""), yE = (y===null||y===undefined||y==="");
        if(xE && yE) return 0;
        if(xE) return 1;              // 空值始终排在末尾
        if(yE) return -1;
        if(typeof x === "number" && typeof y === "number") return (x-y) * st.sortDir;
        return String(x).localeCompare(String(y), "zh-CN") * st.sortDir;
      });
    }
    return r;
  }
  function paint(){
    const all = filtered(), total = all.length;
    const data = st.size ? all.slice((st.page-1)*st.size, st.page*st.size) : all;
    tbody.innerHTML = "";
    if(!data.length){
      const cols = opts.columns.length;
      tbody.append(el("tr",{},el("td",{colspan:cols},el("div",{class:"empty"},opts.emptyText||"暂无数据"))));
    } else {
      data.forEach(r => {
        const tr = el("tr");
        opts.columns.forEach(c => {
          const td = el("td",{class:c.left?"l":""});
          if(c.cls) td.className = (c.left?"l ":"") + c.cls(r);
          const v = c.render ? c.render(r) : r[c.key];
          if(v && v.nodeType) td.append(v);
          else { td.innerHTML = (v===null||v===undefined||v==="") ? "--" : v; }
          tr.append(td);
        });
        tbody.append(tr);
      });
    }
    Array.from(thead.querySelectorAll("th")).forEach(th => {
      const isSorted = th._key === st.sortKey;
      th.classList.toggle("sorted", isSorted);
      const ar = th.querySelector(".ar");
      if(ar) ar.textContent = isSorted ? (st.sortDir < 0 ? "▼" : "▲") : "↕";
    });
    pager.innerHTML = "";
    if(st.size && total > st.size){
      const pages = Math.max(1, Math.ceil(total/st.size));
      st.page = Math.max(1, Math.min(st.page, pages));
      pager.append(el("span",{},`共 ${num(total)} 条　第 ${st.page} / ${pages} 页　`));
      const mk = (t, f, primary) => { const b = el("button",{class:"btn"+(primary?" primary":""), onclick:()=>{f();paint();}},t); pager.append(b); };
      mk("首页", ()=>st.page=1); mk("上一页", ()=>st.page=Math.max(1,st.page-1));
      mk("下一页", ()=>st.page=Math.min(pages,st.page+1)); mk("末页", ()=>st.page=pages);
    } else if(total){
      pager.append(el("span",{},`共 ${num(total)} 条`));
    }
  }
  const handle = {box, state:st, refresh:paint, getRows:()=>filtered(), setRows(r){ rows = r.slice(); st.page = 1; paint(); }};
  if(typeof opts.controls === "function") opts.controls(handle, ctl);
  else if(opts.controls) ctl.append(opts.controls);
  if(!ctl.childNodes.length) ctl.remove(); else ctl.className = "bd";
  paint();
  return handle;
}

  s.value = VY.v;
  s.onchange = ()=>{ VY.v = s.value; syncHash(); RENDER.variety(); };

    if(!hit) hit = VARIETIES.find(v => v.name.includes(raw));

    if(!hit){
      const av = SEARCH_ALIAS[raw] || SEARCH_ALIAS[raw.toUpperCase()];

    el("div",{class:"x",html:"成交合计 " + big(v.vol) + " 手　持仓合计 " + big(v.ccl) + " 手"})));
  kpi.append(el("div",{class:"kpi"}, el("div",{class:"k",html:"自算品种加权价"}),

    el("div",{class:"x"}, w ? el("span",{class:cls(w.zdf), html:sign(w.zdf,2)+"%　"}) : "数据不足",

       + ":" + String(d.getSeconds()).padStart(2,"0");

function klQuoteTarget(){
  const code = String(KL.code||"");
  if(code.startsWith("WK:")) return {kind:"wk", v:code.slice(3)};
  const up = code.toUpperCase();
  const rec = CONTRACTS.find(c => String(c.sina||"").toUpperCase() === up);

/* 加权合约实时行情：成员合约按持仓量加权自算 */
async function wkQuoteNow(v){
  const mem = wkMembers(v);
  if(!mem.length) return null;
  const mkts = Array.from(new Set(mem.map(m => m.market)));
  const lists = await Promise.all(mkts.map(m => emMarketList(m).catch(()=>[])));
  const idx = {};
  mkts.forEach((m,i) => (lists[i]||[]).forEach(x => { idx[m + "|" + String(x.dm||"").toUpperCase()] = x; }));
  let sw=0, sp=0, so=0, sh=0, sl=0, sz=0, sv=0, sc=0, sr=0, scje=0, n=0;
  mem.forEach(m => {
    const q = idx[m.market + "|" + String(m.code).toUpperCase()];
    if(!q || !(+q.p > 0)) return;
    const w = +q.ccl || +m.ccl || 0;
    if(!(w > 0)) return;
    sw += w; sp += (+q.p)*w; so += (+q.o||0)*w; sh += (+q.h||0)*w; sl += (+q.l||0)*w;
    sz += (+q.zjsj||0)*w; sv += (+q.vol||0); sc += (+q.ccl||0); sr += (+q.rz||0); scje += (+q.cje||0);
    n++;
  });
  if(!n || sw <= 0) return null;
  const p = sp/sw, zjsj = sz/sw, hi = sh/sw, lo = sl/sw;
  return {p, zjsj, o:so/sw, h:hi, l:lo, zde:p-zjsj,
          zdf: zjsj ? (p/zjsj-1)*100 : 0, vol:sv, ccl:sc, rz:sr, cje:scje,
          zf: zjsj ? (hi-lo)/zjsj*100 : null,
          members:n, wsum:sw};
}

function qtCells(q){

function klLastCells(){
  const r = (KL.rows && KL.rows.length) ? KL.rows[KL.rows.length-1] : null;

function klineTargets(){
  const map = new Map();
  const add = (code, label) => { if(code && !map.has(code)) map.set(code, label); };
  // 品种主连
  VARIETIES.filter(v => v.sinaLink).forEach(v => add(v.sinaLink, `${v.variety} ${v.name} · 主连（${v.sinaLink}）`));
  // 真实合约
  CONTRACTS.filter(c => c.kind === "real" && c.sinaUsable).forEach(c =>
    add(c.sina, `${c.name}（${c.code}）· 真实合约`));
  // 品种加权合约（自算，非东财指数）
  Object.keys(WK_INDEX).forEach(v => {
    const vv = VAR_BY[v];
    if(vv) add("WK:" + v, `${v} ${vv.name} · 品种加权（自算，含过期合约）`);
  });
  return Array.from(map, ([code, label]) => ({code, label}));
}

        + `② 该合约的新浪K线代码不可用（可换用「主连」代码重试）；③ 浏览器/插件拦截了跨域脚本。<br>`

                .filter(r => !isNaN(r.c) && isFinite(r.c));

function wkMembers(v){
  return CONTRACTS.filter(c => c.variety === v && c.kind === "real" && c.sina && (c.ccl||0) > 0)
    .sort((a,b)=>(b.ccl||0)-(a.ccl||0)).slice(0, 40);
}
function wkFinish(info, rows, pname, srcNote, extra){
  const vn = (VAR_BY[KL.code.slice(3)]||{}).name || KL.code.slice(3);
  const f = rows[0], l = rows[rows.length-1];
  const chg = (l.c - f.o) / f.o * 100;
  info.innerHTML = "";
  info.append(el("div",{class:"notice ok", html:
    `<b>${KL.code.slice(3)} ${vn}（品种加权·自算）</b>　${pname}　共 <b>${num(rows.length)}</b> 根K线 ${extra||""}　`
    + `区间 <b>${f.d}</b> ~ <b>${l.d}</b>　最新收盘 <b>${num2(l.c)}</b>　`
    + `区间涨跌 <b class="${cls(chg)}">${sign(chg,2)}%</b>　`
    + `<span class="mini">（导出 Excel 含全部 ${num(rows.length)} 行）</span>`
    + `<br><span class="mini">${srcNote}</span>`}));
  KL.rows = rows;
  drawKline(rows, KL.code.slice(3) + " " + vn + " · 品种加权（自算）");
}
function wkAggregate(rows, mode, n0){
  if(mode === "week" || mode === "month" || mode === "year"){
    const n = rows.length;
    const out = aggregate(rows, mode);
    return {rows:out, note:`（由 ${num(n)} 根日K聚合为 ${num(out.length)} 根${n0?`，日K由 ${num(n0)} 个真实合约加权合成`:""}）`};
  }
  return {rows, note:""};
}
async function loadWeightedKline(pname){
  const info = $("#klinfo"); if(!info) return;
  const v = KL.code.slice(3);
  const vn = (VAR_BY[v]||{}).name || v;
  const DAILY = ["day","week","month","year"].includes(KL.period);

  /* ---- A. 日/周/月/年：优先读采集端快照（含已过期合约、逐日持仓量加权） ---- */
  if(DAILY && IS_HTTP){
    info.innerHTML = "";
    info.append(el("div",{class:"notice info"}, el("span",{class:"spin"}),
      el("span",{html:`正在读取 <b>${v} ${vn}</b> 的品种加权日K快照（全部真实合约按持仓量加权自算）…`})));
    try{
      const j = await loadLocal("data/weighted_kline/" + v + ".json");
      const raw = (j.rows||[]).map(a => ({d:a[0], o:+a[1], h:+a[2], l:+a[3], c:+a[4], v:+(a[5]||0), p:+(a[6]||0)}))
        .filter(r => !isNaN(r.c) && isFinite(r.c));
      if(raw.length){
        const {rows, note} = wkAggregate(raw, KL.period, j.contracts);
        wkFinish(info, rows, pname,
          `数据源：采集端以新浪财经日K（<code>stock2.finance.sina.com.cn</code>）抓取该品种全部真实合约（含近期过期合约，本次 ${j.contracts} 个）`
          + `，逐日按<b>持仓量</b>加权合成（加权价=Σ价×持仓÷Σ持仓）；非东财指数。快照生成于 ${META.generatedAt||"--"}，运行「更新数据.bat」可刷新。`, note);
        return;
      }
    }catch(e){ /* 快照缺失 -> 实时降级 */ }
  }

  /* ---- B. 实时计算：当前挂牌真实合约（分时/分钟级；或无快照时的日K降级） ---- */
  const mem = wkMembers(v);
  if(!mem.length){
    info.innerHTML = "";
    info.append(el("div",{class:"notice err", html:
      `<b>${v} ${vn}</b> 没有可用于自算加权的真实合约成员（需要合约有新浪代码且持仓量 &gt; 0）。`}));
    return;
  }
  const isLiveDaily = DAILY;   // 日K降级到实时（说明历史深度受限）
  info.innerHTML = "";
  info.append(el("div",{class:"notice info"}, el("span",{class:"spin"}),
    el("span",{html:`正在并发拉取 <b>${v} ${vn}</b> 的 <b>${mem.length}</b> 个成员合约 ${pname} 数据，按持仓量加权自算…`})));
  const results = await Promise.all(mem.map(m =>
    sinaJSONP(m.sina, DAILY ? "day" : KL.period).then(r => ({m, rows:r||[]})).catch(()=>({m, rows:[]}))));
  const ok = results.filter(r => r.rows.length);
  if(!ok.length){
    info.innerHTML = "";
    info.append(el("div",{class:"notice err", html:
      `<b>加权K线计算失败：</b>${v} ${vn} 的 ${mem.length} 个成员合约 ${pname} 数据均拉取失败`
      + `（新浪接口 <code>stock2.finance.sina.com.cn</code> 不可达或被拦截）。请检查网络后重试。`}));
    return;
  }
  const map = {};
  ok.forEach(({m, rows}) => rows.forEach(r => {
    const k = r.d; if(!k) return;
    const w = DAILY ? (+m.ccl || 1) : (+m.ccl || 1);
    const o = +r.o, h = +r.h, l = +r.l, c = +r.c, vv = +(r.v||0);
    if(isNaN(c) || !isFinite(c)) return;
    const cur = map[k] || (map[k] = {d:k, so:0, sh:0, sl:0, sc:0, w:0, v:0});
    cur.so += o*w; cur.sh += h*w; cur.sl += l*w; cur.sc += c*w; cur.w += w; cur.v += vv;
  }));
  const keys = Object.keys(map).sort();
  let raw = keys.map(k => { const t = map[k];
    return {d:k, o:+(t.so/t.w).toFixed(3), h:+(t.sh/t.w).toFixed(3),
            l:+(t.sl/t.w).toFixed(3), c:+(t.sc/t.w).toFixed(3), v:Math.round(t.v), p:Math.round(t.w)}; });
  if(!raw.length){
    info.innerHTML = "";
    info.append(el("div",{class:"notice warn", html:
      `接口正常返回，但 <b>${v} ${vn}</b> 的 ${pname} <b>无可用数据</b>（成员合约数据为空或时间戳无法对齐）。`}));
    return;
  }
  const {rows, note} = DAILY ? wkAggregate(raw, KL.period, ok.length)
                             : {rows:raw, note:`（由 ${ok.length} 个成员合约按当前持仓量加权合成）`};
  const srcNote = DAILY
    ? (IS_HTTP
        ? `实时自算（快照缺失时降级）：当前挂牌真实合约 ${ok.length} 个按<b>当前持仓量</b>加权合成（近似口径，未含已过期合约）。运行「更新数据.bat」生成完整快照（含过期合约、逐日持仓量加权）。`
        : `实时自算：当前挂牌真实合约 ${ok.length} 个按<b>当前持仓量</b>加权合成（近似口径，未含已过期合约）。`
          + `完整口径请双击「启动本地服务.bat」后访问——将自动读取含过期合约的加权日K快照。`)
    : `实时自算：新浪财经分时/分钟K线接口，成员合约 ${ok.length} 个按<b>当前持仓量</b>加权（加权价=Σ价×持仓÷Σ持仓，成交量为合计）；非东财指数。`;
  wkFinish(info, rows, pname, srcNote, note);
}
function drawKline(rows, title){
  const dom = $("#klchart"); if(!dom) return;
  if(KL.chart){ KL.chart.dispose(); KL.chart = null; }
  KL.chart = echarts.init(dom);
  const cats = rows.map(r => r.d);
  const ohlc = rows.map(r => [r.o, r.c, r.l, r.h]);
  const vols = rows.map(r => ({value:r.v, itemStyle:{color: r.c >= r.o ? "#f0b4b0" : "#b2e0c8"}}));
  const ma = n => rows.map((_, i) => {
    if(i < n-1) return null;
    let s2 = 0; for(let j = i-n+1; j <= i; j++) s2 += rows[j].c;
    return +(s2/n).toFixed(3);
  });
  const zs = rows.length > 300 ? 100 - 300/rows.length*100 : 0;
  KL.chart.setOption({
    animation:false,
    title:{text:title, left:8, top:2, textStyle:{fontSize:12.5,fontWeight:600,color:"#1b2432"}},

          + `<br/>量 ${num(r.v)}　持仓 ${num(r.p)}`;

    legend:{right:12, top:2, data:["MA5","MA10","MA20","MA60"], textStyle:{fontSize:11,color:"#5b6b80"}},
    grid:[{left:62, right:22, top:34, height:"56%"},{left:62, right:22, top:"70%", height:"18%"}],
    xAxis:[
      {type:"category", data:cats, gridIndex:0, boundaryGap:true, axisLine:{lineStyle:{color:"#dfe6ef"}},

       axisLabel:{color:"#8b9aad",fontSize:10}},

       itemStyle:{color:"#d8342b", color0:"#0a9d5c", borderColor:"#d8342b", borderColor0:"#0a9d5c"}},
      {name:"MA5",  type:"line", data:ma(5),  smooth:true, showSymbol:false, lineStyle:{width:1,color:"#e6a23c"}},
      {name:"MA10", type:"line", data:ma(10), smooth:true, showSymbol:false, lineStyle:{width:1,color:"#2563eb"}},

  const P = (k, l, w, fn, d) => ({key:k, label:l, w:w,
    render: fn || (r => (r[k]===null||r[k]===undefined||r[k]==="") ? "--" : num(r[k], d||0))});
  const rankCol = {key:"__r", label:"名次", w:7, sortable:true, render:r=>r.__r};
  const member = {key:"MEMBER_NAME_ABBR", label:"会员简称", left:true, w:14};
  const org = {key:"ORG_CODE", label:"会员代码", left:true, w:11};
  const money = (k,l,w) => ({key:k, label:l, w:w, cls:r=>cls(r[k]),
    render:r=>{ const v = r[k]; return (v===null||v===undefined||v===""||isNaN(v)) ? "--" : big(v); }});
  let rows = data.map((r,i)=>Object.assign({}, r, {__r:i+1}));
  if(tab === "build"){
    return {rows, cols:[
      {key:"TRADE_DATE", label:"交易日期", left:true, w:12, render:r=>String(r.TRADE_DATE||"").slice(0,10)},
      member, org,
      P("VOLUME","成交量",11), P("VOLUMERANK","成交量排名",11),
      P("LONG_POSITION","多头持仓",11), P("LP_CHANGE","多头增减",11),
      P("SHORT_POSITION","空头持仓",11), P("SP_CHANGE","空头增减",11),
      P("NET_LONG_POSITION","净多持仓",11), P("NET_SHORT_POSITION","净空持仓",11)]};
  }
  if(tab === "avgPpal"){
    return {rows, cols:[rankCol, member, org,
      P("LONG_POSITION","多头持仓",11), P("SHORT_POSITION","空头持仓",11),
      P("NET_LONG_POSITION","净多持仓",11), P("NET_SHORT_POSITION","净空持仓",11),
      {key:"LP_AVERAGE_PRICE", label:"多头持仓均价", w:13, render:r=>num2(r.LP_AVERAGE_PRICE)},
      {key:"SP_AVERAGE_PRICE", label:"空头持仓均价", w:13, render:r=>num2(r.SP_AVERAGE_PRICE)},
      {key:"LP_AVRNEW_PRICE",  label:"多头最新均价", w:13, render:r=>num2(r.LP_AVRNEW_PRICE)},
      {key:"SP_AVRNEW_PRICE",  label:"空头最新均价", w:13, render:r=>num2(r.SP_AVRNEW_PRICE)},
      {key:"SETTLE_PRICE",     label:"当日结算价", w:12, render:r=>num2(r.SETTLE_PRICE)}]};
  }
  if(tab === "profit"){
    return {rows, cols:[rankCol, member, org,
      P("LONG_POSITION","多头持仓",11), P("SHORT_POSITION","空头持仓",11),
      P("NET_LONG_POSITION","净多持仓",11), P("NET_SHORT_POSITION","净空持仓",11),
      money("LP_FLUCTUATE_PAL","多头浮动盈亏",14), money("SP_FLUCTUATE_PAL","空头浮动盈亏",14),
      money("FLUCTUATE_PAL","合计浮动盈亏",14), money("LP_ACCUM_PAL","多头累计盈亏",14),
      money("SP_ACCUM_PAL","空头累计盈亏",14), money("ACCUM_PAL","合计累计盈亏",14)]};
  }
  return {rows, cols:[rankCol, member, org,
    P("VOLUME","成交量",11), P("VOLUME_CHANGE","成交量增减",12), P("VOLUMERANK","成交量排名",11),
    P("LONG_POSITION","多头持仓",11), P("LP_CHANGE","多头增减",11), P("LPRANK","多头排名",9),
    P("SHORT_POSITION","空头持仓",11), P("SP_CHANGE","空头增减",11), P("SPRANK","空头排名",9),
    P("NET_LONG_POSITION","净多持仓",11), P("NET_SHORT_POSITION","净空持仓",11)]};
}
async function exportAllLhb(btn){
  const old = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "正在拉取 6 类数据…"; }
  const res = await Promise.all(LHB_TABS.map(t => getLhbTab(t.k).then(r => ({t, rows:r.rows})).catch(()=>({t, rows:[]}))));
  const sheets = [];
  res.forEach(({t, rows}) => { if(rows.length) sheets.push({name:LHB.code + "_" + t.n, rows, header:lhbTable(t.k, rows).cols}); });
  if(btn){ btn.disabled = false; btn.textContent = old; }
  if(!sheets.length){ toast("没有可用数据可导出","err"); return; }
  exportMulti(sheets, `${LHB.code}_期货龙虎榜_${LHB.date||META.tradeDate}.xlsx`);
}

/* =====================================================================
   7. 品种资讯
   ===================================================================== */
const NW = {kw:"", onlyHit:false};
RENDER.news = function(){
  const wrap = el("div");
  wrap.append(el("div",{class:"notice info", html:
    "<b>数据源：</b>东方财富期货频道 <code>futures.eastmoney.com/a/</code> 的品种资讯页与品种评论页；"
    + "新浪财经期货频道 <code>finance.sina.com.cn/money/future/</code> 的品种资讯页，以及新浪期货品种行情页。<br>"
    + "东方财富只对部分品种单独建立了资讯页；<b>未建立页面的品种</b>已明确标注并给出频道入口，不会给出失效链接。"}));
  const bar = el("div",{class:"bar"});
  const q = el("input",{type:"search",placeholder:"搜索品种代码 / 名称 / 交易所", style:"width:230px"});
  const cb = el("span",{class:"chip"+(NW.onlyHit?" on":""), onclick:()=>{ NW.onlyHit = !NW.onlyHit; RENDER.news(); },
    html:"仅显示有东财资讯页的品种"});
  const stat = el("span",{class:"mini"});
  q.oninput = ()=>{ NW.kw = q.value.trim(); paint(); };
  bar.append(q, cb, stat);
  bar.append(el("button",{class:"btn", onclick:()=>exportSheet(newsRows(), [
    {key:"variety",label:"品种代码",w:10},{key:"name",label:"品种名称",w:12},{key:"exchName",label:"交易所",w:14},
    {key:"sector",label:"品种类型",w:10},{key:"night",label:"夜盘",w:8},
    {key:"emNews",label:"东财资讯页",w:48},{key:"emNewsComment",label:"东财评论页",w:48},
    {key:"sinaNews",label:"新浪资讯页",w:48},{key:"sinaQuote",label:"新浪行情页",w:48},
    {key:"note",label:"备注",w:34}], `期货品种资讯链接_${todayStr()}.xlsx`, "品种资讯链接"), html:"导出链接表 Excel"}));
  wrap.append(el("div",{class:"card"}, el("div",{class:"hd2"}, el("h3",{},"品种资讯链接总览"),
    el("div",{class:"desc",html:"每个品种对应的东方财富 / 新浪财经资讯与行情入口"})), el("div",{class:"bd"}, bar)));
  const grid = el("div",{class:"grid g3"});
  wrap.append(grid);
  function newsRows(){
    return VARIETIES.filter(v => {
      const n = NEWS[v.variety] || {};
      if(!(n.emNews || n.sinaNews)) return false;
      if(NW.onlyHit && !n.emNews) return false;
      return true;
    }).map(v => {
      const n = NEWS[v.variety] || {};
      return Object.assign({}, v, {night:v.night?"有":"无", emNews:n.emNews||"", emNewsComment:n.emNewsComment||"",
        sinaNews:n.sinaNews||"", sinaQuote:n.sinaQuote||"", note:n.note||""});
    }).sort((a,b)=>a.exchName.localeCompare(b.exchName,'zh-CN') || a.variety.localeCompare(b.variety));
  }
  function paint(){
    const all = newsRows();
    const k = NW.kw.toUpperCase();
    let vs = all;
    if(NW.kw) vs = all.filter(v => v.variety.includes(k) || v.name.includes(NW.kw) || v.exchName.includes(NW.kw));
    stat.textContent = `　共 ${all.length} 个品种有资讯入口，当前显示 ${vs.length} 个`;
    grid.innerHTML = "";
    if(!vs.length){ grid.append(el("div",{class:"empty", style:"grid-column:1/-1"},"没有匹配的品种")); return; }
    vs.forEach(v => {
      const n = NEWS[v.variety] || {};
      const c = el("div",{class:"newscard"});
      c.append(el("h4",{}, el("span",{class:"dot"}), v.name,
        el("span",{class:"tag k-real"}, v.variety),
        el("span",{class:"mini"}, v.exchName),
        el("span",{class:"mini"}, v.night==="有"?"· 有夜盘":"· 无夜盘")));
      const L = el("div",{class:"links"});
      const lnk = (href, txt, k2) => href
        ? L.append(el("a",{href,target:"_blank",rel:"noopener"}, el("span",{class:"dot "+(k2||"")}), txt, el("span",{class:"mini",html:"↗"})))
        : L.append(el("div",{class:"none"}, "· " + txt + "：暂无"));
      lnk(n.emNews, "东方财富 · " + (n.emNewsTitle ? String(n.emNewsTitle).replace(/[_ ]*东方财富网.*$/,"") : v.name) + "（品种资讯页）", "em");
      lnk(n.emNewsComment, "东方财富 · " + v.name + "评论页", "em");
      lnk(n.sinaNews, "新浪财经 · " + v.name + "资讯页", "sina");
      lnk(n.sinaQuote, "新浪财经 · " + v.name + "行情页", "sina");
      if(!n.emNews) L.append(el("div",{class:"none", html:"※ " + (n.note || "东方财富未单独设立该品种资讯页")}));
      c.append(L);
      const acts = el("div",{class:"bar", style:"margin:10px 0 0"});
      acts.append(el("button",{class:"btn", onclick:()=>{ VY.v = v.variety; switchPage("variety"); }, html:"看品种行情"}));
      acts.append(el("button",{class:"btn", onclick:()=>{ KL.code = (VAR_BY[v.variety]||{}).sinaLink || KL.code; switchPage("kline"); }, html:"看K线"}));
      acts.append(el("button",{class:"btn", onclick:()=>{
        const lc = v.lhbCode; if(lc && LHB_INDEX[lc]){ LHB.code = lc; } switchPage("lhb"); }, html:"看龙虎榜"}));
      if(n.emNewsChannel) acts.append(el("a",{class:"btn",href:n.emNewsChannel,target:"_blank",html:"东财频道"}));
      if(n.sinaChannel) acts.append(el("a",{class:"btn",href:n.sinaChannel,target:"_blank",html:"新浪频道"}));
      c.append(acts);
      grid.append(c);
    });
  }
  paint();
  setView(wrap);
};

      + "再运行 <code>生成终端页面.py</code> 重新打包本页面。"}));
    return;
  }
  renderHeader();
  renderFooter();
  initLiveRefresh();
  if(!location.hash) history.replaceState(null, "", "#overview");
  window.addEventListener("hashchange", applyHash);
  applyHash();
  let rt = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(rt);
    rt = setTimeout(()=>{ if(KL.chart) KL.chart.resize(); }, 160);
  });
})();
